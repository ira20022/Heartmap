.option-btn.selected{background:var(--color-background-primary);border-color:var(--color-border-primary);border-width:1.5px}
.opt-text{font-size:14px;font-weight:500;color:var(--color-text-primary)}
.opt-sub{font-size:12px;color:var(--color-text-secondary);margin-top:3px;line-height:1.4}
.progress-bar{height:3px;background:var(--color-background-secondary);border-radius:2px;margin-bottom:1.5rem;overflow:hidden}
.progress-fill{height:100%;background:var(--color-border-primary);border-radius:2px;transition:width 0.3s}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:1.5rem;gap:12px}
.nav-btn{padding:8px 20px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:transparent;color:var(--color-text-primary);font-size:14px;cursor:pointer;transition:all 0.15s}
.nav-btn:hover{background:var(--color-background-secondary)}
.nav-btn:disabled{opacity:0.3;cursor:default}

.counter{font-size:13px;color:var(--color-text-tertiary)}
.result-wrap{padding:1.5rem 0}
.result-hero{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:2rem;margin-bottom:1rem;text-align:center}
.result-emoji{font-size:48px;margin-bottom:1rem;display:block}
.result-name{font-size:22px;font-weight:500;color:var(--color-text-primary);margin-bottom:0.5rem}
.result-tagline{font-size:14px;color:var(--color-text-secondary);margin-bottom:1rem;line-height:1.5}
.result-desc{font-size:14px;color:var(--color-text-primary);line-height:1.7;text-align:left}
.style-badge{display:inline-block;font-size:12px;font-weight:500;padding:4px 12px;border-radius:20px;background:var(--color-background-secondary);color:var(--color-text-secondary);margin-bottom:1.25rem}
.scores-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:1rem}
.score-card{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:12px 14px}
.score-label{font-size:11px;color:var(--color-text-tertiary);margin-bottom:6px}
.score-bar-wrap{height:4px;background:var(--color-background-primary);border-radius:2px;overflow:hidden;margin-bottom:4px}
.score-bar{height:100%;border-radius:2px;transition:width 0.5s}
.score-val{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.secondary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1rem}
.sec-card{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 12px;text-align:center}
.sec-label{font-size:11px;color:var(--color-text-tertiary);margin-bottom:4px}
.sec-val{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.restart-btn{padding:10px 28px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:transparent;color:var(--color-text-primary);font-size:14px;cursor:pointer;margin-top:1rem}

let current=0, answers={}, showResult=false;

function scoreAnswers(){
  const scores={secure:0,anxious:0,avoidant:0,disorganized:0};
  const sec={expressiveness:0,independence:0,intensity:0};
  Object.entries(answers).forEach(([qId,optId])=>{
    const m=SCORE_MAP[qId]&&SCORE_MAP[qId][optId];
    if(!m)return;
    scores[m.primary]+=m.weight;
    if(m.sec){Object.entries(m.sec).forEach(([k,v])=>{sec[k]+=v;});}
  });
  return{scores,sec};
}

function classifySec(scores,sec){
  const total=Object.values(scores).reduce((a,b)=>a+b,0)||1;
  const pct={};
  Object.entries(scores).forEach(([k,v])=>{pct[k]=v/total;});
  const dom=Object.entries(scores).sort((a,b)=>b[1]-a[1])[0][0];
  const expLevel=sec.expressiveness>8?'high':sec.expressiveness>2?'mid':'low';
  const indLevel=sec.independence>8?'high':sec.independence>2?'mid':'low';
  const intLevel=sec.intensity>8?'high':sec.intensity>2?'mid':'low';
  return{dom,pct,expLevel,indLevel,intLevel,sec};
}

function matchPersona(dom,expLevel,indLevel,intLevel){
  const pool=PERSONAS.filter(p=>p.attachmentStyle.toLowerCase()===dom);
  if(!pool.length)return PERSONAS[0];
  let best=null,bestScore=999;
  pool.forEach(p=>{
    const eScore=p.profile.expressiveness===expLevel?0:1;
    const iScore=p.profile.independence===indLevel?0:1;
    const nScore=p.profile.intensity===intLevel?0:1;
    const total=eScore+iScore+nScore;
    if(total<bestScore){bestScore=total;best=p;}
  });
  return best||pool[0];
}

function renderQuestion(){
  const q=QUESTIONS[current];
  const area=document.getElementById('question-area');
  const sel=answers[q.id]||null;
  area.innerHTML=`
    <div class="question-card">
      <div class="q-meta">
        <span class="q-num">Q${q.number}</span>
        <span class="q-signal">${q.signal}</span>
      </div>
      <div class="q-scenario">${q.scenario}</div>
      <div class="q-context">${q.context}</div>
      <div class="options">
        ${q.options.map(o=>`
          <button class="option-btn${sel===o.id?' selected':''}" onclick="selectOption('${q.id}','${o.id}')">
            <span class="opt-text">${o.text}</span>
            <span class="opt-sub">${o.subtext}</span>
          </button>
        `).join('')}
      </div>
    </div>`;
  const pct=Math.round((current+1)/QUESTIONS.length*100);
  document.getElementById('progress').style.width=pct+'%';
  document.getElementById('counter').textContent=`${current+1} / ${QUESTIONS.length}`;
  document.getElementById('btn-prev').disabled=current===0;
  const nextBtn=document.getElementById('btn-next');
  if(current===QUESTIONS.length-1){
    nextBtn.textContent='See my result →';
    nextBtn.onclick=()=>finishQuiz();
  }else{
    nextBtn.textContent='Next →';
    nextBtn.onclick=()=>navigate(1);
  }
  nextBtn.disabled=!sel;
}

function selectOption(qId,optId){
  answers[qId]=optId;
  renderQuestion();
}

function navigate(dir){
  const newIdx=current+dir;
  if(newIdx<0||newIdx>=QUESTIONS.length)return;
  current=newIdx;
  renderQuestion();
}

function finishQuiz(){
  const {scores,sec}=scoreAnswers();
  const {dom,pct,expLevel,indLevel,intLevel}=classifySec(scores,sec);
  const persona=matchPersona(dom,expLevel,indLevel,intLevel);
  showResultScreen(persona,scores,sec,pct);
}

function showResultScreen(persona,scores,sec,pct){
  const total=Object.values(scores).reduce((a,b)=>a+b,0)||1;
  const styleColors={secure:'#1D9E75',anxious:'#D85A30',avoidant:'#378ADD',disorganized:'#7F77DD'};
  const app=document.getElementById('app');
  const expVal=sec.expressiveness;
  const indVal=sec.independence;
  const intVal=sec.intensity;
  app.innerHTML=`
    <div class="result-hero">
      <span class="result-emoji">${persona.emoji}</span>
      <div class="result-name">${persona.name}</div>
      <div class="style-badge">${persona.attachmentStyle} · ${persona.archetype}</div>
      <div class="result-tagline">${persona.tagline}</div>
      <div class="result-desc">${persona.description}</div>
    </div>
    <div class="scores-grid">
      ${['secure','anxious','avoidant','disorganized'].map(s=>{
        const val=Math.round(scores[s]/total*100);
        return`<div class="score-card">
          <div class="score-label">${s.charAt(0).toUpperCase()+s.slice(1)}</div>
          <div class="score-bar-wrap"><div class="score-bar" style="width:${val}%;background:${styleColors[s]}"></div></div>
          <div class="score-val">${val}%</div>
        </div>`;
      }).join('')}
    </div>
    <div class="secondary-grid">
      <div class="sec-card">
        <div class="sec-label">Expressiveness</div>
        <div class="sec-val">${expVal>8?'High':expVal>2?'Mid':'Low'} (${expVal>0?'+':''}${expVal})</div>
      </div>
      <div class="sec-card">
        <div class="sec-label">Independence</div>
        <div class="sec-val">${indVal>8?'High':indVal>2?'Mid':'Low'} (${indVal>0?'+':''}${indVal})</div>
      </div>
      <div class="sec-card">
        <div class="sec-label">Intensity</div>
        <div class="sec-val">${intVal>8?'High':intVal>2?'Mid':'Low'} (${intVal>0?'+':''}${intVal})</div>
      </div>
    </div>
    <div style="text-align:center">
      <button class="restart-btn" onclick="restartQuiz()">Retake quiz</button>
      <button class="share-btn" onclick="sendPrompt('I got ${persona.name} on the quiz — ${persona.tagline} Tell me more about what this means for how I love.')">Explore this result ↗</button>
    </div>`;
}

function restartQuiz(){
  current=0;answers={};
  const app=document.getElementById('app');
  app.innerHTML=`
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:0%"></div></div>
    <div id="question-area"></div>
    <div class="nav" id="nav-area">
      <button class="nav-btn" id="btn-prev" onclick="navigate(-1)" disabled>← Back</button>
      <span class="counter" id="counter">1 / 30</span>
      <button class="nav-btn primary" id="btn-next" onclick="navigate(1)">Next →</button>
    </div>`;
  renderQuestion();
}

renderQuestion();
</script>
